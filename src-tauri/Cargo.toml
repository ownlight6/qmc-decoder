[package]
name = "qmc-decoder-app"
version = "0.3.0"
description = "QMC Decoder desktop app: Tauri frontend driving the qmc_decoder core library"
edition = "2021"

[lib]
name = "qmc_decoder_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
# Package name (hyphen) is used for resolution; the crate is imported as
# `qmc_decoder` because that is the library target name in the root package.
qmc-decoder = { path = ".." }
