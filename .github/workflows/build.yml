name: Build, test and package qmc-decoder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback for every PR: compile + run tests, no packaging.
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is not included: the tauri shell needs webkit2gtk system libs.
        os: [macos-15, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --workspace

  # Produce real installers (Windows .exe/.msi, macOS .dmg/.app) with
  # tauri-action. On a v* tag push it also creates a draft GitHub Release
  # with the bundles attached; otherwise the bundles are uploaded as
  # workflow artifacts so they can be downloaded from the run page.
  package:
    name: Package installer (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: build-test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon -> native arm64 build, matches local dev
          - name: macos-arm64
            os: macos-15
            args: ""
          # Intel Macs: cross-compile x86_64 from the arm64 runner (works because
          # the app is pure Rust + Apple SDK frameworks, no C dependencies)
          - name: macos-x64
            os: macos-15
            args: --target x86_64-apple-darwin
          # windows-latest produces both NSIS (.exe) and MSI (.msi) installers
          - name: windows
            os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the Intel cross-compile target needs an explicit install;
          # arm64 is the native target on macos-15 runners
          targets: ${{ matrix.name == 'macos-x64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bundle installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
          # Only create a GitHub Release when a version tag (v*) is pushed;
          # on other pushes/dispatches the bundles are just uploaded as
          # workflow artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: QMC Decoder v__VERSION__
          releaseBody: See the assets to download and install this version.
          releaseDraft: true
          prerelease: false
