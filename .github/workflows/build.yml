name: Build qmc-decoder

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: false
      version:
        description: 'Release version (e.g. 0.3.0), required if publishing'
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            name: qmc-decoder-macos-arm64
            ext: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            name: qmc-decoder-macos-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: qmc-decoder-windows-x86_64
            ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-gui

      # Build CLI-only binary
      - name: Build release (CLI)
        run: cargo build --release --target ${{ matrix.target }}

      # Build GUI binary (includes CLI functionality when run with arguments)
      - name: Build release (GUI)
        run: cargo build --release --target ${{ matrix.target }} --features gui

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          # CLI binary tarball
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.name }}.${{ matrix.ext }}" qmc-decoder

          # .app bundle (double-click to launch GUI, no Terminal window)
          mkdir -p "QMC Decoder.app/Contents/MacOS"
          mkdir -p "QMC Decoder.app/Contents/Resources"
          cp qmc-decoder "QMC Decoder.app/Contents/MacOS/qmc-decoder"
          chmod +x "QMC Decoder.app/Contents/MacOS/qmc-decoder"
          cp "$GITHUB_WORKSPACE/macos/Info.plist" "QMC Decoder.app/Contents/Info.plist"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.name }}-app.tar.gz" "QMC Decoder.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path qmc-decoder.exe -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.name }}.${{ matrix.ext }}"

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload .app bundle (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-app
          path: ${{ matrix.name }}-app.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_release == 'true' && github.event.inputs.version != '' }}
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}