name: Package qmc-decoder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.4.0 (published from current branch HEAD)"
        required: true
        type: string

jobs:
  package:
    name: Package & publish (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon -> native arm64 build
          - name: macos-arm64
            os: macos-15
            args: ""
          # Intel Macs: cross-compile x86_64 from the arm64 runner
          - name: macos-x64
            os: macos-15
            args: --target x86_64-apple-darwin
          # windows-latest produces both NSIS (.exe) and MSI (.msi) installers
          - name: windows
            os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the Intel cross-compile target needs an explicit install;
          # arm64 is the native target on macos-15 runners
          targets: ${{ matrix.name == 'macos-x64' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build, bundle & publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}
          # Manual runs use the tag typed in the dispatch dialog;
          # tag pushes use the app version from tauri.conf.json.
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v__VERSION__' }}
          releaseName: QMC Decoder ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v__VERSION__' }}
          releaseBody: See the assets to download and install this version.
          releaseDraft: false
          prerelease: false
