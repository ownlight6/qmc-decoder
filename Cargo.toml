[package]
name = "qmc-decoder"
version = "0.2.0"
edition = "2021"
description = "Decrypt QQ Music encrypted audio files (QMC1/QMC2 formats) with auto ekey fetching"
license = "GPL-3.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
tc_tea = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
tokio = { version = "1", features = ["rt"] }
dirs = "6"
